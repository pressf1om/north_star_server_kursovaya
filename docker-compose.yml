services:
  postgres:
    image: postgres:15-alpine
    container_name: north-star-db
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: northstar_user
      POSTGRES_PASSWORD: northstar_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar_user -d northstar"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
